name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: bash -n bin/paper && bash -n install.sh
      - name: ShellCheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -S warning bin/paper install.sh
      - name: Smoke test (help, version)
        run: |
          chmod +x bin/paper
          ./bin/paper --version
          ./bin/paper --help 2>&1 | head -5
