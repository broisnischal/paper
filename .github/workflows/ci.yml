name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Build (Debug)
        run: zig build

      - name: Test
        run: zig build test

      - name: Smoke test (help, version)
        run: |
          zig build -Doptimize=ReleaseFast
          ./zig-out/bin/paper --version
          ./zig-out/bin/paper --help | head -5

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck installer
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          bash -n install.sh
          shellcheck -S warning install.sh
