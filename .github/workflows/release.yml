name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { os: linux,   arch: x86_64,  target: x86_64-linux-musl }
          - { os: linux,   arch: aarch64, target: aarch64-linux-musl }
          - { os: macos,   arch: x86_64,  target: x86_64-macos }
          - { os: macos,   arch: aarch64, target: aarch64-macos }
          - { os: windows, arch: x86_64,  target: x86_64-windows }
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Cross-compile ${{ matrix.target }}
        run: zig build -Doptimize=ReleaseFast -Dtarget=${{ matrix.target }}

      - name: Package
        run: |
          set -euo pipefail
          pkg="paper-${{ matrix.os }}-${{ matrix.arch }}"
          mkdir -p "dist/$pkg"
          if [ "${{ matrix.os }}" = windows ]; then
            cp zig-out/bin/paper.exe "dist/$pkg/"
          else
            cp zig-out/bin/paper "dist/$pkg/"
          fi
          cp README.md LICENSE "dist/$pkg/"
          if [ "${{ matrix.os }}" = windows ]; then
            (cd dist && zip -qr "$pkg.zip" "$pkg")
          else
            tar -C dist -czf "dist/$pkg.tar.gz" "$pkg"
          fi
          rm -rf "dist/$pkg"

      - uses: actions/upload-artifact@v4
        with:
          name: paper-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: (cd dist && sha256sum ./*.tar.gz ./*.zip > checksums.txt && ls -la)

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
          generate_release_notes: true

      - name: Bump Homebrew tap formula
        env:
          TAP_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${TAP_TOKEN:-}" ]; then
            echo "TAP_GITHUB_TOKEN secret not set — skipping tap bump."
            exit 0
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          URL="https://github.com/broisnischal/paper/archive/refs/tags/v${VERSION}.tar.gz"
          SHA=$(curl -fsSL "$URL" | sha256sum | cut -d' ' -f1)

          git clone "https://x-access-token:${TAP_TOKEN}@github.com/broisnischal/homebrew-paper.git" tap
          cd tap
          sed -i \
            -e "s|^  url .*|  url \"$URL\"|" \
            -e "s|^  sha256 .*|  sha256 \"$SHA\"|" \
            Formula/paper.rb
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "paper $VERSION" || { echo "formula already current"; exit 0; }
          git push
